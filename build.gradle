// Top-level build file where you can add configuration options common to all sub-projects/modules.

plugins {
    id 'com.android.application' version '9.5.0' apply false
    // Kotlin встроен в AGP 9, но сам AGP тянет KGP 2.2.10; объявленная здесь версия
    // поднимает его до свежей стабильной (плагин не применяется, только classpath).
    id 'org.jetbrains.kotlin.android' version '2.4.21' apply false
    // 1.23.8 -- последняя стабильная. Единственный источник предупреждений Gradle в сборке:
    // ReportingExtension.file() (удалят в Gradle 10) и Configuration.setVisible() (Gradle 11).
    // Замена -- detekt 2.0 (id dev.detekt), пока только альфа.
    id 'io.gitlab.arturbosch.detekt' version '1.23.8' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
