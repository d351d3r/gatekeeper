apply plugin: 'com.android.application'
apply plugin: 'io.gitlab.arturbosch.detekt'

def versionPropsFile = rootProject.file('version.properties')
def versionProps = new Properties()
if (versionPropsFile.canRead()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
} else {
    versionProps['VERSION_NAME'] = '1.5.0'
    versionProps['VERSION_CODE'] = '150'
}

// CI passes -PversionCode=<n> to pin the build number; otherwise version.properties is used.
def versionCodeValue = (project.findProperty('versionCode') ?: versionProps.getProperty('VERSION_CODE', '150')).toInteger()

android {
    compileSdk 36
    buildToolsVersion = '36.0.0'
    defaultConfig {
        applicationId "io.gatekeeper"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode versionCodeValue
        versionName versionProps.getProperty('VERSION_NAME', '1.5.0')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        // Фиксированный debug-keystore в репозитории: без этого каждый прогон
        // CI генерирует свой эфемерный ~/.android/debug.keystore, и debug APK
        // от разных сборок имеют разные подписи -- Android отказывается
        // обновлять такой пакет ("конфликтует"). Debug-ключ не секретен.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // In CI the release APK is signed with a keystore supplied via -P properties
        // (decoded from the CI_RELEASE_KEYSTORE secret). Local release builds fall
        // back to the debug signing config.
        release {
            if (project.hasProperty('ciReleaseKeystore')) {
                storeFile = file(project.property('ciReleaseKeystore'))
                storePassword = project.property('ciReleaseStorePassword')
                keyAlias = project.property('ciReleaseKeyAlias')
                keyPassword = project.property('ciReleaseKeyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug
        }
    }
    splits {
        abi {
            enable = true
            reset()
            include 'arm64-v8a'
            universalApk = false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        disable 'MissingTranslation', 'ExtraTranslation', 'GoogleAppIndexingWarning', 'InvalidFragmentVersionForActivityResult'
    }
    buildFeatures {
        aidl = true
        buildConfig = true
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    namespace = 'io.gatekeeper'
}

detekt {
    buildUponDefaultConfig = true
    baseline = file('detekt-baseline.xml')
}

afterEvaluate {
    tasks.register('fixAidlGeneratedComments') {
        doLast {
            def aidlOut = layout.buildDirectory.dir('generated/aidl_source_output_dir').get().asFile
            if (!aidlOut.exists()) return
            aidlOut.eachFileRecurse { f ->
                if (f.name.endsWith('.java')) {
                    def lines = f.readLines()
                    if (!lines.isEmpty() && lines[0].startsWith('/*')) {
                        def end = lines.findIndexOf { it.contains('*/') }
                        if (end >= 0) {
                            f.text = lines.drop(end + 1).join('\n')
                        }
                    }
                }
            }
        }
    }

    tasks.matching { it.name == 'compileDebugAidl' || it.name == 'compileReleaseAidl' }.configureEach {
        finalizedBy('fixAidlGeneratedComments')
    }

    tasks.matching { it.name.endsWith('JavaWithJavac') || it.name.endsWith('Kotlin') }.configureEach {
        dependsOn('fixAidlGeneratedComments')
    }

    // Copy the built arm64 APK to the repo root with a versioned, human-readable name.
    ['Debug', 'Release'].each { bt ->
        tasks.named("assemble${bt}").configure {
            doLast {
                def apkDir = layout.buildDirectory.dir("outputs/apk/${bt.toLowerCase()}").get().asFile
                def versionName = android.defaultConfig.versionName
                def versionCode = android.defaultConfig.versionCode
                apkDir.listFiles()?.findAll { it.name.endsWith('.apk') }?.each { apk ->
                    copy {
                        from apk
                        into rootProject.projectDir
                        rename { "Gatekeeper-${versionName}-(${versionCode})-${bt.toLowerCase()}.apk" }
                    }
                }
            }
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.fragment:fragment:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    debugImplementation project(path: ':setup-wizard-lib', configuration: 'gingerbreadCompatDebugRuntimeElements')
    releaseImplementation project(path: ':setup-wizard-lib', configuration: 'gingerbreadCompatReleaseRuntimeElements')
    testImplementation 'junit:junit:4.13.2'
    // JVM-вариант org.json для unit-тестов сериализации бэкапа (на устройстве -- фреймворковый).
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
