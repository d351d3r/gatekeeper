name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test and assemble universal APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Write APK checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum Gatekeeper-*.apk > SHA256SUMS.txt

      - name: Upload universal Android APK
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-universal-debug-apk
          path: |
            app/build/outputs/apk/debug/Gatekeeper-*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
